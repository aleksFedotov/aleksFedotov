name: Generate Terminal Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
          
      - name: Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import requests
          import os

          USERNAME = "aleksFedotov"
          TOKEN = os.environ["GITHUB_TOKEN"]
          HEADERS = {"Authorization": f"token {TOKEN}"}

          # Get user stats
          user_resp = requests.get(f"https://api.github.com/users/{USERNAME}", headers=HEADERS)
          user_data = user_resp.json()

          repos_resp = requests.get(f"https://api.github.com/users/{USERNAME}/repos?per_page=100", headers=HEADERS)
          repos_data = repos_resp.json()

          stars = sum(r["stargazers_count"] for r in repos_data)
          forks = sum(r["forks_count"] for r in repos_data)
          total_repos = len(repos_data)

          # Generate SVG
          svg = f'''<?xml version="1.0" encoding="UTF-8"?>
          <svg width="500" height="200" xmlns="http://www.w3.org/2000/svg">
            <rect width="100%" height="100%" fill="#0d1117" rx="6"/>
            <text x="20" y="30" fill="#00ff00" font-family="monospace" font-size="16" font-weight="bold">aleksFedotov@github:~$ neofetch</text>
            <text x="20" y="60" fill="#00ff00" font-family="monospace" font-size="14">OS: Hobby Developer</text>
            <text x="20" y="85" fill="#00ff00" font-family="monospace" font-size="14">Repos: {total_repos}</text>
            <text x="20" y="110" fill="#00ff00" font-family="monospace" font-size="14">Stars: {stars}</text>
            <text x="20" y="135" fill="#00ff00" font-family="monospace" font-size="14">Forks: {forks}</text>
            <text x="20" y="160" fill="#00ff00" font-family="monospace" font-size="14">Followers: {user_data.get('followers', 0)}</text>
            <text x="20" y="185" fill="#00ff00" font-family="monospace" font-size="14">Location: {user_data.get('location', 'Unknown')}</text>
          </svg>'''

          os.makedirs("generated", exist_ok=True)
          with open("generated/stats.svg", "w") as f:
              f.write(svg)

          print("Stats generated!")
          EOF
          
      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          add: 'generated/'
          message: 'Update terminal stats'
          default_author: github_actions
