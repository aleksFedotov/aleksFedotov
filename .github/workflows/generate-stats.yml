name: Generate Terminal Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: main-push-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import requests
          import os
          import datetime

          USERNAME = "aleksFedotov"
          TOKEN = os.environ["GITHUB_TOKEN"]
          HEADERS = {"Authorization": f"token {TOKEN}"}

          # Get user stats
          user_resp = requests.get(f"https://api.github.com/users/{USERNAME}", headers=HEADERS)
          user_data = user_resp.json()

          repos_resp = requests.get(f"https://api.github.com/users/{USERNAME}/repos?per_page=100", headers=HEADERS)
          repos_data = repos_resp.json()

          stars = sum(r["stargazers_count"] for r in repos_data)
          forks = sum(r["forks_count"] for r in repos_data)
          total_repos = len(repos_data)

          # Get languages
          languages = {}
          for repo in repos_data:
              if repo["language"] and not repo["fork"]:
                  lang = repo["language"]
                  languages[lang] = languages.get(lang, 0) + 1

          top_langs = sorted(languages.items(), key=lambda x: x[1], reverse=True)[:5]

          # Split languages into two lines if more than 3
          lang_items = [f"{lang} ({count})" for lang, count in top_langs]
          if len(lang_items) > 3:
              langs_line1 = ", ".join(lang_items[:3]) + ","
              langs_line2 = ", ".join(lang_items[3:])
          else:
              langs_line1 = ", ".join(lang_items)
              langs_line2 = ""

          # Fetch public events for streak calculation
          events_resp = requests.get(f"https://api.github.com/users/{USERNAME}/events?per_page=100", headers=HEADERS)
          events = events_resp.json()

          commit_days = set()
          for event in events:
              if event.get("type") == "PushEvent":
                  date_str = event.get("created_at", "")[:10]
                  if date_str:
                      commit_days.add(date_str)

          # Calculate current streak
          today = datetime.date.today()
          current_streak = 0
          check_date = today

          while True:
              date_str = check_date.strftime("%Y-%m-%d")
              if date_str in commit_days:
                  current_streak += 1
                  check_date -= datetime.timedelta(days=1)
              else:
                  # Today may simply have no commits yet
                  if check_date == today:
                      check_date -= datetime.timedelta(days=1)
                      continue
                  break

          # Calculate longest streak
          sorted_days = sorted(commit_days, reverse=True)
          longest_streak = 0
          temp_streak = 0
          prev_date = None

          for day_str in sorted_days:
              day = datetime.datetime.strptime(day_str, "%Y-%m-%d").date()
              if prev_date and (prev_date - day).days == 1:
                  temp_streak += 1
              else:
                  temp_streak = 1
              longest_streak = max(longest_streak, temp_streak)
              prev_date = day

          # Generate SVG with blinking cursor
          svg = f'''<?xml version="1.0" encoding="UTF-8"?>
          <svg width="100%" height="305" viewBox="0 0 800 305" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <defs>
              <style>
                .cursor {{
                  animation: blink 1s step-end infinite;
                }}
                @keyframes blink {{
                  0%, 100% {{ opacity: 1; }}
                  50% {{ opacity: 0; }}
                }}
              </style>
            </defs>
            <rect width="100%" height="100%" fill="#0d1117" rx="6"/>
            <text x="40" y="30" fill="#00ff00" font-family="monospace" font-size="16" font-weight="bold">aleksFedotov@github:~$ neofetch</text>
            <text x="40" y="60" fill="#00ff00" font-family="monospace" font-size="14">OS: Hobby Developer</text>
            <text x="40" y="85" fill="#00ff00" font-family="monospace" font-size="14">Repos: {total_repos}</text>
            <text x="40" y="110" fill="#00ff00" font-family="monospace" font-size="14">Stars: {stars}</text>
            <text x="40" y="135" fill="#00ff00" font-family="monospace" font-size="14">Forks: {forks}</text>
            <text x="40" y="160" fill="#00ff00" font-family="monospace" font-size="14">Followers: {user_data.get('followers', 0)}</text>
            <text x="40" y="185" fill="#00ff00" font-family="monospace" font-size="14">Location: {user_data.get('location', 'Unknown')}</text>
            <text x="40" y="210" fill="#00ff00" font-family="monospace" font-size="14">Languages: {langs_line1}</text>
            <text x="40" y="230" fill="#00ff00" font-family="monospace" font-size="14">{langs_line2}</text>
            <text x="40" y="255" fill="#00ff00" font-family="monospace" font-size="14">Current Streak: {current_streak} days</text>
            <text x="40" y="280" fill="#00ff00" font-family="monospace" font-size="14">Longest Streak: {longest_streak} days</text>
            <text x="40" y="305" fill="#00ff00" font-family="monospace" font-size="16" font-weight="bold">aleksFedotov@github:~$</text>
            <rect x="265" y="293" width="10" height="16" fill="#00ff00" class="cursor" />
          </svg>'''

          os.makedirs("generated", exist_ok=True)
          with open("generated/stats.svg", "w") as f:
              f.write(svg)

          print("Stats generated!")
          print(f"Current streak: {current_streak}")
          print(f"Longest streak: {longest_streak}")
          EOF

      - name: Sync with remote main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase --autostash origin/main

      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          add: 'generated/'
          message: 'Update terminal stats with streak info'
          default_author: github_actions
